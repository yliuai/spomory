[project]
name = "spomory-desktop-extension"
version = "0.1.0"
description = "Wrapper so `uv run` resolves the real spomory package for the Desktop Extension."
requires-python = ">=3.11"
dependencies = [
    # No "embedding" extra on purpose: EMBEDDING_PROVIDER=openai_compatible
    # (set in manifest.json) calls the same LLM API's /v1/embeddings
    # endpoint instead of pulling in sentence-transformers + torch, which
    # would turn first launch into a 100+MB download for a double-click
    # installer aimed at non-technical users.
    "spomory[llm,mcp]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
