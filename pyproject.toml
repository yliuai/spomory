[project]
name = "memory-core"
version = "0.1.0"
description = "AI个人记忆产品 — 检索+记忆管理内核"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0",
]
embedding = [
    "sentence-transformers>=3.0",
]
rl = [
    "trl>=0.9",
    "peft>=0.11",
    "transformers>=4.40",
]
cloud = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "stripe>=9.0",
    "cryptography>=42",
    "psycopg[binary]>=3.1",
    "python-multipart>=0.0.9",
    "resend>=2.0",
]
mcp = [
    "mcp>=2.0",
]
multimodal = [
    "transformers>=4.40",
    "torch>=2.0",
    "pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
memory-core-mcp = "memory_core.mcp_server.__main__:main"
memory-core-mcp-remote = "cloud_api.remote_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_core", "src/cloud_api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: downloads a model / trains — skip with `-m 'not slow'` for a quick loop",
]
